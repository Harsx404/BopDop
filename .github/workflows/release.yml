name: Release

# Push a tag like v1.2.0 → builds the release APK and publishes a GitHub release with it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: sh gradlew --no-daemon :app:assembleRelease

      - name: Name the APK after the tag
        run: cp app/build/outputs/apk/release/app-release.apk "BopDop-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: BopDop ${{ github.ref_name }}
          files: BopDop-${{ github.ref_name }}.apk
          generate_release_notes: true
