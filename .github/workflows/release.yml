name: Release

# Push a tag like v1.2.0 — or run it by hand with a version — to build the
# release APK and publish a GitHub release with it (the tag is created if needed).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.0 build-tools;37.0.0 platform-tools"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        run: sh gradlew --no-daemon :app:assembleRelease

      - name: Name the APKs after the tag
        run: |
          cp app/build/outputs/apk/release/app-universal-release.apk "BopDop-${TAG}.apk"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "app/build/outputs/apk/release/app-${abi}-release.apk" "BopDop-${TAG}-${abi}.apk"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: BopDop ${{ env.TAG }}
          files: BopDop-${{ env.TAG }}*.apk
          generate_release_notes: true
